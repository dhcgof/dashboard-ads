<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Campanhas — MDL & Cantinho da Girafa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mdl-orange: #FF6B00;
    --mdl-gold: #FFB300;
    --mdl-brown: #5D3A1A;
    --girafa-blue: #1565C0;
    --girafa-purple: #7C4DFF;
    --girafa-green: #4CAF50;
    --girafa-yellow: #FFD600;
    --ink: #1a1a2e;
    --paper: #fcfaf7;
    --card: #ffffff;
    --muted: #8a8a9a;
    --line: #ececf2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,179,0,0.10), transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(124,77,255,0.08), transparent 45%),
      var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding: 32px 24px 60px;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 16px; margin-bottom: 32px;
  }
  .title-block h1 {
    font-family: 'Fredoka', sans-serif; font-size: 2.1rem; font-weight: 700;
    letter-spacing: -0.5px; line-height: 1;
  }
  .title-block h1 .a { color: var(--mdl-orange); }
  .title-block h1 .b { color: var(--girafa-purple); }
  .title-block p { color: var(--muted); font-size: 0.95rem; margin-top: 6px; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line);
    padding: 10px 16px; border-radius: 100px; font-size: 0.85rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--girafa-green);
    box-shadow: 0 0 0 4px rgba(76,175,80,0.18); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .resumo { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
    gap: 16px; margin-bottom: 28px; }
  .kpi {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 20px 22px; position: relative; overflow: hidden;
    box-shadow: 0 4px 18px rgba(0,0,0,0.03);
  }
  .kpi::before { content:''; position:absolute; top:0; left:0; width:100%; height:4px;
    background: linear-gradient(90deg, var(--mdl-orange), var(--mdl-gold)); }
  .kpi .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase;
    letter-spacing: 0.5px; font-weight: 500; }
  .kpi .value { font-family: 'Fredoka', sans-serif; font-size: 1.9rem; font-weight: 700;
    margin-top: 6px; }

  .empresa-tag {
    display:inline-flex; align-items:center; gap:7px; font-size:0.78rem; font-weight:600;
    padding: 4px 11px; border-radius: 100px; margin-bottom: 14px;
  }
  .tag-mdl { background: rgba(255,107,0,0.12); color: var(--mdl-orange); }
  .tag-girafa { background: rgba(124,77,255,0.12); color: var(--girafa-purple); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(370px,1fr)); gap: 20px; }
  .camp {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    transition: transform .2s, box-shadow .2s; animation: rise .5s both;
  }
  .camp:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
  @keyframes rise { from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none} }

  .camp-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .camp-name { font-family:'Fredoka',sans-serif; font-size:1.15rem; font-weight:600; line-height:1.2; }
  .camp-obj { color: var(--muted); font-size: 0.82rem; margin-top: 3px; }

  .badge { font-size:0.72rem; font-weight:600; padding:5px 11px; border-radius:100px; white-space:nowrap; }
  .b-active { background: rgba(76,175,80,0.15); color:#2e7d32; }
  .b-paused { background: rgba(255,179,0,0.18); color:#b27800; }
  .b-other  { background: rgba(138,138,154,0.15); color: var(--muted); }

  .metrics { display:grid; grid-template-columns: repeat(3,1fr); gap:14px; margin-top:20px; }
  .metric { background: var(--paper); border-radius: 12px; padding: 12px 14px; }
  .metric .m-label { font-size: 0.7rem; color: var(--muted); text-transform:uppercase;
    letter-spacing:0.4px; }
  .metric .m-value { font-family:'Fredoka',sans-serif; font-size:1.15rem; font-weight:600; margin-top:3px; }

  .sep { height:1px; background:var(--line); margin:18px 0 14px; }
  .week { display:flex; justify-content:space-between; font-size:0.82rem; color:var(--muted); }
  .week b { color: var(--ink); font-weight:600; }

  .alerta { margin-top:14px; padding:11px 14px; border-radius:11px; font-size:0.85rem;
    display:flex; align-items:center; gap:9px; }
  .alerta-warn { background: rgba(255,179,0,0.12); color:#9a6b00; }
  .alerta-crit { background: rgba(244,67,54,0.10); color:#c62828; }
  .alerta-ok   { background: rgba(76,175,80,0.10); color:#2e7d32; }

  .erro-card { border-style:dashed; opacity:0.75; }
  .loading { text-align:center; padding:60px; color:var(--muted); font-size:1.1rem; }
  footer { text-align:center; margin-top:40px; color:var(--muted); font-size:0.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h1><span class="a">Campanhas</span> <span class="b">Dashboard</span></h1>
      <p>Lojas MDL · Cantinho da Girafa — atualizado a cada 6 horas</p>
    </div>
    <div class="status-pill">
      <span class="dot"></span>
      <span>Última atualização: <strong id="atualizado">—</strong></span>
    </div>
  </header>

  <div class="resumo" id="resumo"></div>
  <div id="conteudo"><div class="loading">Carregando dados das campanhas…</div></div>

  <footer>
    Painel hospedado no GitHub Pages · Dados atualizados via GitHub Actions a cada 6 horas
  </footer>
</div>

<script>
function badgeClass(status){
  if(/ACTIVE/i.test(status)) return 'b-active';
  if(/PAUSED/i.test(status)) return 'b-paused';
  return 'b-other';
}
function statusLabel(status){
  if(/ACTIVE/i.test(status)) return 'No ar';
  if(/PAUSED/i.test(status)) return 'Pausada';
  return status;
}

async function carregar(){
  try {
    const r = await fetch('data/campaigndata.json');
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    document.getElementById('atualizado').textContent = d.atualizado_em;

    // resumo
    document.getElementById('resumo').innerHTML = `
      <div class="kpi"><div class="label">Campanhas ativas</div><div class="value">${d.resumo.total_campanhas}</div></div>
      <div class="kpi"><div class="label">Gasto hoje (total)</div><div class="value">${d.resumo.gasto_hoje}</div></div>
    `;

    // agrupa por empresa
    const porEmpresa = {};
    d.campanhas.forEach(c => { (porEmpresa[c.empresa] ||= []).push(c); });

    let html = '';
    for(const [empresa, lista] of Object.entries(porEmpresa)){
      const tagClass = empresa.includes('MDL') ? 'tag-mdl' : 'tag-girafa';
      html += `<div style="grid-column:1/-1; margin-top:8px;">
        <span class="empresa-tag ${tagClass}">● ${empresa}</span></div>`;
      html += '<div class="grid" style="grid-column:1/-1;">';
      lista.forEach((c, i) => {
        if(c.erro){
          html += `<div class="camp erro-card">
            <div class="camp-name">${c.nome}</div>
            <div class="alerta alerta-warn">⚠️ ${c.erro}</div></div>`;
          return;
        }
        let alertaHtml = '';
        if(c.alerta && c.alerta.length){
          c.alerta.forEach(([icone, txt]) => {
            const cls = icone === '🔴' ? 'alerta-crit' : 'alerta-warn';
            alertaHtml += `<div class="alerta ${cls}">${icone} ${txt}</div>`;
          });
        } else {
          alertaHtml = `<div class="alerta alerta-ok">✓ Tudo saudável</div>`;
        }
        html += `
          <div class="camp" style="animation-delay:${i*0.06}s">
            <div class="camp-head">
              <div>
                <div class="camp-name">${c.nome}</div>
                <div class="camp-obj">${c.objetivo} · Orçamento ${c.orcamento}/dia</div>
              </div>
              <span class="badge ${badgeClass(c.status)}">${statusLabel(c.status)}</span>
            </div>
            <div class="metrics">
              <div class="metric"><div class="m-label">Gasto hoje</div><div class="m-value">${c.gasto_hoje}</div></div>
              <div class="metric"><div class="m-label">Alcance</div><div class="m-value">${c.alcance_hoje}</div></div>
              <div class="metric"><div class="m-label">Impressões</div><div class="m-value">${c.impressoes_hoje}</div></div>
              <div class="metric"><div class="m-label">Frequência</div><div class="m-value">${c.frequencia_hoje}</div></div>
              <div class="metric"><div class="m-label">CPM</div><div class="m-value">${c.cpm_hoje}</div></div>
              <div class="metric"><div class="m-label">Cliques</div><div class="m-value">${c.cliques_hoje}</div></div>
            </div>
            <div class="sep"></div>
            <div class="week">
              <span>Últimos 7 dias:</span>
              <span><b>${c.gasto_7d}</b> gastos · <b>${c.alcance_7d}</b> alcance · freq <b>${c.frequencia_7d}</b></span>
            </div>
            ${alertaHtml}
          </div>`;
      });
      html += '</div>';
    }
    document.getElementById('conteudo').innerHTML = html || '<div class="loading">Nenhuma campanha encontrada.</div>';
  } catch(e){
    document.getElementById('conteudo').innerHTML =
      `<div class="loading">Erro ao carregar: ${e.message}<br><small>O arquivo data/campaigndata.json pode ainda não ter sido gerado. Aguarde a primeira execução do GitHub Actions.</small></div>`;
  }
}

carregar();
</script>
</body>
</html>
