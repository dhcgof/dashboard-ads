<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Campanhas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1565C0 0%, #7C4DFF 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .account-selection {
            background: white;
            padding: 60px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 900px;
        }
        
        .account-selection.hidden {
            display: none;
        }
        
        .selection-header {
            text-align: center;
            margin-bottom: 50px;
        }
        
        .selection-header h1 {
            color: #1565C0;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 35px;
        }
        
        .account-card {
            background: #f9f9f9;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .account-card:hover {
            border-color: #1565C0;
            box-shadow: 0 8px 20px rgba(21, 101, 192, 0.15);
            transform: translateY(-5px);
        }
        
        .account-card.selected {
            border-color: #1565C0;
            background: #f0f7ff;
        }
        
        .account-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .account-card h3 {
            color: #333;
            font-size: 18px;
            margin-bottom: 8px;
        }
        
        .account-card p {
            color: #999;
            font-size: 13px;
        }
        
        .btn-continue {
            background: #1565C0;
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 15px;
        }
        
        .btn-continue:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .dashboard-screen {
            width: 100%;
            max-width: 1400px;
            display: none;
        }
        
        .dashboard-screen.show {
            display: block;
        }
        
        .header {
            background: white;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #1565C0;
            font-size: 26px;
        }
        
        .logout-btn {
            padding: 10px 20px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .content {
            background: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .content h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 22px;
        }
        
        .campaign-card {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid #1565C0;
            margin-bottom: 20px;
        }
        
        .campaign-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .campaign-name {
            color: #333;
            font-size: 18px;
            font-weight: 600;
        }
        
        .campaign-status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .status-active {
            background: #c8e6c9;
            color: #2e7d32;
        }
        
        .status-paused {
            background: #ffccbc;
            color: #d84315;
        }
        
        .campaign-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .meta-item {
            background: white;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #1565C0;
        }
        
        .meta-label {
            color: #999;
            font-size: 12px;
            margin-bottom: 4px;
        }
        
        .meta-value {
            color: #333;
            font-size: 16px;
            font-weight: 600;
        }
        
        .campaign-details {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 13px;
            color: #666;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .detail-row:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            color: #999;
        }
        
        .detail-value {
            color: #333;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- SELEÇÃO DE CONTA - SEM LOGIN -->
    <div class="account-selection show" id="accountSelection">
        <div class="selection-header">
            <h1>🎯 Dashboard Campanhas</h1>
            <p>Selecione uma conta para gerenciar</p>
        </div>
        
        <div class="accounts-grid" id="accountsGrid"></div>
        
        <div style="text-align: center; padding-top: 30px; border-top: 1px solid #eee;">
            <button class="btn-continue" id="continueBtn" disabled>Acessar Conta →</button>
        </div>
    </div>
    
    <!-- DASHBOARD -->
    <div class="dashboard-screen" id="dashboardScreen">
        <div class="header">
            <h1 id="dashboardTitle">📊 Dashboard</h1>
            <button class="logout-btn" onclick="goBack()">← Voltar</button>
        </div>
        
        <div class="content">
            <h2>📈 Campanhas Ativas</h2>
            <div id="campaignsList"></div>
        </div>
    </div>

    <script>
        const ACCOUNTS = {
            'girafa': {
                name: 'Cantinho da Girafa',
                icon: '🎀',
                description: 'Brinquedoteca e Aluguel de Brinquedos',
                campaigns: [
                    {
                        name: '3 Dias de Loucura — Fechamento Maio',
                        status: 'active',
                        objective: 'Awareness',
                        budget: 'R$ 200/dia',
                        period: '26-30 maio 2026',
                        impressions: '403.5K',
                        clicks: '847',
                        spend: 'R$ 755',
                        ctr: '0,21%',
                        cpc: 'R$ 0,89',
                        adsets: 2,
                        ads: 3
                    },
                    {
                        name: 'Seguidores Ativos Pooh — Expansão',
                        status: 'paused',
                        objective: 'Awareness',
                        budget: 'R$ 1.000/total',
                        period: '27/05 — 30/06/2026',
                        impressions: '77.9K',
                        clicks: '1.036',
                        spend: 'R$ 701',
                        ctr: '1,33%',
                        cpc: 'R$ 0,68',
                        adsets: 2,
                        ads: 4
                    }
                ]
            },
            'mdl': {
                name: 'MDL Móveis do Lar',
                icon: '🛋️',
                description: 'Loja de Móveis e Eletrodomésticos',
                campaigns: [
                    {
                        name: '3 Dias de Loucura — Fechamento Maio',
                        status: 'active',
                        objective: 'Awareness',
                        budget: 'R$ 200/dia',
                        period: '26-30 maio 2026',
                        impressions: '152K',
                        clicks: '1.250',
                        spend: 'R$ 425',
                        ctr: '0,82%',
                        cpc: 'R$ 0,34',
                        adsets: 1,
                        ads: 2
                    },
                    {
                        name: 'Feirão de Móveis',
                        status: 'paused',
                        objective: 'Traffic',
                        budget: 'R$ 150/dia',
                        period: '20-25 maio 2026',
                        impressions: '89.3K',
                        clicks: '620',
                        spend: 'R$ 300',
                        ctr: '0,69%',
                        cpc: 'R$ 0,48',
                        adsets: 2,
                        ads: 3
                    }
                ]
            }
        };
        
        let selectedAccount = null;
        
        function initialize() {
            const grid = document.getElementById('accountsGrid');
            grid.innerHTML = Object.entries(ACCOUNTS).map(([key, account]) => `
                <div class="account-card" onclick="selectAccount('${key}')" data-account="${key}">
                    <div class="account-icon">${account.icon}</div>
                    <h3>${account.name}</h3>
                    <p>${account.description}</p>
                    <div style="color: #4CAF50; font-size: 12px; margin-top: 10px; font-weight: 600;">✓ Ativo</div>
                </div>
            `).join('');
        }
        
        function selectAccount(key) {
            selectedAccount = key;
            document.querySelectorAll('.account-card').forEach(el => el.classList.remove('selected'));
            document.querySelector(`[data-account="${key}"]`).classList.add('selected');
            document.getElementById('continueBtn').disabled = false;
            document.getElementById('continueBtn').onclick = () => showDashboard(key);
        }
        
        function showDashboard(key) {
            const account = ACCOUNTS[key];
            document.getElementById('accountSelection').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.add('show');
            document.getElementById('dashboardTitle').textContent = `${account.icon} ${account.name}`;
            
            const list = document.getElementById('campaignsList');
            list.innerHTML = account.campaigns.map(c => `
                <div class="campaign-card">
                    <div class="campaign-header">
                        <span class="campaign-name">${c.name}</span>
                        <span class="campaign-status ${c.status === 'active' ? 'status-active' : 'status-paused'}">
                            ${c.status === 'active' ? '🟢 ATIVA' : '⏸️ PAUSADA'}
                        </span>
                    </div>
                    
                    <div class="campaign-meta">
                        <div class="meta-item"><div class="meta-label">Objetivo</div><div class="meta-value">${c.objective}</div></div>
                        <div class="meta-item"><div class="meta-label">Orçamento</div><div class="meta-value">${c.budget}</div></div>
                        <div class="meta-item"><div class="meta-label">Período</div><div class="meta-value">${c.period}</div></div>
                    </div>
                    
                    <div class="campaign-details">
                        <div class="detail-row"><span class="detail-label">📊 Impressões</span><span class="detail-value">${c.impressions}</span></div>
                        <div class="detail-row"><span class="detail-label">🔗 Cliques</span><span class="detail-value">${c.clicks}</span></div>
                        <div class="detail-row"><span class="detail-label">💰 Gasto Total</span><span class="detail-value">${c.spend}</span></div>
                        <div class="detail-row"><span class="detail-label">📈 CTR</span><span class="detail-value">${c.ctr}</span></div>
                        <div class="detail-row"><span class="detail-label">💵 CPC</span><span class="detail-value">${c.cpc}</span></div>
                        <div class="detail-row"><span class="detail-label">🎯 Ad Sets</span><span class="detail-value">${c.adsets}</span></div>
                        <div class="detail-row"><span class="detail-label">📢 Anúncios</span><span class="detail-value">${c.ads}</span></div>
                    </div>
                </div>
            `).join('');
        }
        
        function goBack() {
            document.getElementById('dashboardScreen').classList.remove('show');
            document.getElementById('accountSelection').classList.remove('hidden');
            selectedAccount = null;
        }
        
        initialize();
    </script>
</body>
</html>
