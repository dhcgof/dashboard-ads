<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Multi-Empresa — Meta Ads + IA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh}

/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:white;border-radius:16px;padding:40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-card h1{font-size:24px;color:#333;margin-bottom:6px;text-align:center}
.login-card .sub{color:#888;font-size:13px;text-align:center;margin-bottom:28px}
.login-card label{display:block;font-size:12px;color:#666;font-weight:600;margin:14px 0 6px}
.login-card input{width:100%;padding:12px 14px;border:2px solid #e9ecef;border-radius:8px;font-size:14px}
.login-card input:focus{outline:none;border-color:#667eea}
.login-card button{width:100%;margin-top:24px;padding:13px;background:#667eea;color:white;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.login-card button:hover{background:#5568d3}
.login-msg{margin-top:14px;padding:10px;border-radius:6px;font-size:13px;text-align:center;display:none}
.login-msg.error{background:#fee2e2;color:#991b1b;display:block}
.login-hint{margin-top:20px;font-size:11px;color:#aaa;text-align:center;line-height:1.6}

/* APP */
#app{display:none;padding:20px}
.container{max-width:1800px;margin:0 auto}
.topbar{background:white;border-radius:12px;padding:18px 25px;margin-bottom:20px;box-shadow:0 10px 40px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:15px}
.topbar h1{font-size:20px;color:#333}
.topbar .right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.company-select{padding:10px 16px;border:2px solid #667eea;border-radius:8px;font-size:14px;font-weight:600;color:#333;cursor:pointer;background:white;min-width:220px}
.logout-btn{padding:9px 16px;background:#f3f4f6;border:none;border-radius:8px;cursor:pointer;font-size:13px;color:#666;font-weight:600}
.logout-btn:hover{background:#e5e7eb}
.user-chip{font-size:12px;color:#888}

.company-banner{border-radius:12px;padding:20px 25px;margin-bottom:20px;color:white;display:flex;align-items:center;gap:16px}
.company-banner .emoji{font-size:38px}
.company-banner .info h2{font-size:22px;margin-bottom:3px}
.company-banner .info p{font-size:13px;opacity:.9}

.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab-btn{padding:11px 20px;background:white;border:none;border-radius:8px;cursor:pointer;font-weight:600;color:#666;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:.2s}
.tab-btn.active{background:#667eea;color:white;box-shadow:0 5px 15px rgba(102,126,234,.4)}
.tab-content{display:none}
.tab-content.active{display:block}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px;margin-bottom:22px}
.stat-card{background:white;padding:20px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.08);border-left:4px solid #667eea}
.stat-label{color:#999;font-size:11px;font-weight:600;text-transform:uppercase;margin-bottom:8px}
.stat-value{color:#333;font-size:22px;font-weight:700;margin-bottom:4px}
.stat-change{font-size:11px;color:#22c55e}

.score-banner{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:26px;border-radius:12px;text-align:center;margin-bottom:22px}
.score-banner .v{font-size:44px;font-weight:700;margin:8px 0}
.score-banner .l{font-size:13px;opacity:.9}

.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:22px;margin-bottom:22px}
.chart-container{background:white;padding:22px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.08)}
.chart-title{font-size:15px;font-weight:700;color:#333;margin-bottom:18px}
.chart-wrapper{position:relative;height:280px}

.box{background:white;padding:22px;border-radius:12px;margin-bottom:18px;box-shadow:0 4px 15px rgba(0,0,0,.08);border-top:4px solid #22c55e}
.box-title{font-size:15px;font-weight:700;color:#333;margin-bottom:14px}
.item{margin-bottom:11px;padding:12px;background:#f0fdf4;border-left:3px solid #22c55e;border-radius:6px;font-size:13px;color:#555;line-height:1.5}
.rec{background:#f3f4f6;padding:14px;border-radius:8px;margin:9px 0;border-left:3px solid #3b82f6;font-size:13px;color:#555;line-height:1.5}
.inv{background:white;padding:18px;border-radius:12px;margin:13px 0;border:2px solid #e5e7eb;font-size:13px;color:#555;line-height:1.6}
.inv .t{font-weight:700;color:#333;margin-bottom:8px;font-size:14px}

.table-container{background:white;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.08);margin-bottom:18px}
table{width:100%;border-collapse:collapse}
th{background:#f8f9fa;padding:13px;text-align:left;font-weight:600;color:#333;border-bottom:2px solid #e9ecef;font-size:12px}
td{padding:11px 13px;border-bottom:1px solid #e9ecef;color:#666;font-size:13px}
tr:hover{background:#f8f9fa}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-active{background:#dcfce7;color:#166534}
.badge-paused{background:#fee2e2;color:#991b1b}

/* ADMIN */
.admin-form{background:#f8f9fa;padding:20px;border-radius:10px;margin-bottom:18px}
.admin-form label{display:block;font-size:12px;color:#666;font-weight:600;margin:10px 0 5px}
.admin-form input{width:100%;padding:10px;border:2px solid #e9ecef;border-radius:6px;font-size:13px}
.admin-form .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.admin-form button{margin-top:16px;padding:11px 20px;background:#22c55e;color:white;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.empty{color:#aaa;font-size:13px;text-align:center;padding:20px}

.footer{text-align:center;color:white;margin-top:25px;font-size:12px;opacity:.8}
@media(max-width:768px){.stats-grid,.charts-grid{grid-template-columns:1fr}.admin-form .row{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-card">
    <h1>📊 Dashboard Meta Ads</h1>
    <div class="sub">Acesso à central de campanhas</div>
    <label>Email</label>
    <input type="email" id="email" placeholder="seu@email.com" autocomplete="username">
    <label>Senha</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    <button onclick="doLogin()">Entrar</button>
    <div class="login-msg" id="loginMsg"></div>
    <div class="login-hint">Acesso de demonstração:<br>diego@cordeiro.com · diego123</div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="container">
    <div class="topbar">
      <h1>📊 Central de Campanhas</h1>
      <div class="right">
        <select class="company-select" id="companySelect" onchange="selectCompany(this.value)"></select>
        <span class="user-chip" id="userChip"></span>
        <button class="logout-btn" onclick="doLogout()">Sair</button>
      </div>
    </div>

    <div class="company-banner" id="companyBanner"></div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('overview',this)">📈 Visão Geral</button>
      <button class="tab-btn" onclick="switchTab('graficos',this)">📊 Gráficos</button>
      <button class="tab-btn" onclick="switchTab('campanhas',this)">🎯 Campanhas</button>
      <button class="tab-btn" onclick="switchTab('analise',this)">🤖 Análise IA</button>
      <button class="tab-btn" onclick="switchTab('recomendacoes',this)">💡 Recomendações</button>
      <button class="tab-btn" onclick="switchTab('investimentos',this)">💰 Investimentos</button>
      <button class="tab-btn" onclick="switchTab('admin',this)">⚙️ Admin</button>
    </div>

    <div id="overview" class="tab-content active"></div>
    <div id="graficos" class="tab-content"></div>
    <div id="campanhas" class="tab-content"></div>
    <div id="analise" class="tab-content"></div>
    <div id="recomendacoes" class="tab-content"></div>
    <div id="investimentos" class="tab-content"></div>
    <div id="admin" class="tab-content"></div>

    <div class="footer">Powered by Meta Ads MCP + IA · © 2026 Diego Cordeiro</div>
  </div>
</div>

<script>
/* ============================================================
   USUÁRIOS (login único — vê todas as empresas)
   ============================================================ */

  {name:'Diego Cordeiro', email:'diego@cordeiro.com', password:'diego123'},

      {nome:'Vendas/Aluguel', status:'ATIVA', obj:'Vendas', gasto:'R$ 459,01', imp:'55.635', cliques:550, cpm:'R$ 8,25', ctr:'0,99%', conv:'65'},
      {nome:'Leads', status:'ATIVA', obj:'Leads', gasto:'R$ 900,72', imp:'98.583', cliques:1330, cpm:'R$ 9,14', ctr:'1,35%', conv:'192'}

/* ============ ESTADO ============ */
let companies = [];
let currentCompanyId = null;
const charts = {};

function loadCompanies(){
  const saved = localStorage.getItem('companies_v1');
  companies = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_COMPANIES));
}
function saveCompanies(){ localStorage.setItem('companies_v1', JSON.stringify(companies)); }

/* ============ LOGIN ============ */
function doLogin(){
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pass = document.getElementById('password').value;
  const msg = document.getElementById('loginMsg');
  const user = USERS.find(u => u.email===email && u.password===pass);
  if(!user){ msg.textContent='Email ou senha incorretos'; msg.className='login-msg error'; return; }
  sessionStorage.setItem('session', JSON.stringify({name:user.name, email:user.email}));
  startApp(user);
}
function doLogout(){ sessionStorage.removeItem('session'); location.reload(); }

function startApp(user){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('userChip').textContent='👤 '+user.name;
  loadCompanies();
  renderCompanySelect();
  selectCompany(companies[0].id);
}

/* ============ SELETOR DE EMPRESA ============ */
function renderCompanySelect(){
  const sel = document.getElementById('companySelect');
  sel.innerHTML = companies.map(c=>`<option value="${c.id}">${c.emoji} ${c.nome}</option>`).join('');
  if(currentCompanyId) sel.value = currentCompanyId;
}
function getCompany(){ return companies.find(c=>c.id===currentCompanyId); }

function selectCompany(id){
  currentCompanyId = id;
  document.getElementById('companySelect').value = id;
  const c = getCompany();
  const banner = document.getElementById('companyBanner');
  banner.style.background = `linear-gradient(135deg, ${c.cor}, ${shade(c.cor,-30)})`;
  banner.innerHTML = `<div class="emoji">${c.emoji}</div>
    <div class="info"><h2>${c.nome}</h2>
    <p>${c.cidade} · Conta Meta: ${c.contaMeta} · Score IA: ${c.score}/10</p></div>`;
  renderAll();
}

/* ============ RENDER ABAS ============ */
function renderAll(){
  const c = getCompany();
  // Overview
  document.getElementById('overview').innerHTML = `
    <div class="score-banner"><div class="l">SCORE DE PERFORMANCE</div>
      <div class="v">${c.score}</div><div class="l">de 10</div></div>
    <div class="stats-grid">
      ${statCard('Gasto (30 dias)',c.stats.gasto)}
      ${statCard('Impressões',c.stats.impressoes)}
      ${statCard('Cliques',c.stats.cliques)}
      ${statCard('CPL Médio',c.stats.cpl)}
      ${statCard('ROAS',c.stats.roas)}
      ${statCard('Conversões',c.stats.conversoes)}
    </div>
    <div class="box"><div class="box-title">📌 Resumo</div>
      ${c.insights.map(i=>`<div class="item"><strong>${i[0]}</strong><br>${i[1]}</div>`).join('')}
    </div>`;
  // Campanhas
  document.getElementById('campanhas').innerHTML = `
    <div class="table-container"><table>
      <thead><tr><th>Campanha</th><th>Status</th><th>Objetivo</th><th>Gasto</th><th>Impressões</th><th>Cliques</th><th>CPM</th><th>CTR</th><th>Conv.</th></tr></thead>
      <tbody>${c.campanhas.map(k=>`<tr>
        <td><strong>${k.nome}</strong></td>
        <td><span class="badge ${k.status==='ATIVA'?'badge-active':'badge-paused'}">${k.status}</span></td>
        <td>${k.obj}</td><td>${k.gasto}</td><td>${k.imp}</td><td>${k.cliques}</td><td>${k.cpm}</td><td>${k.ctr}</td><td>${k.conv}</td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  // Análise IA
  document.getElementById('analise').innerHTML = `
    <div class="box"><div class="box-title">🤖 Análise Inteligente — ${c.nome}</div>
      ${c.insights.map(i=>`<div class="item"><strong>${i[0]}</strong><br>${i[1]}</div>`).join('')}
    </div>`;
  // Recomendações
  document.getElementById('recomendacoes').innerHTML = `
    <div class="box"><div class="box-title">💡 Recomendações Prioritárias</div>
      ${c.recomendacoes.map(r=>`<div class="rec"><strong>${r[0]}</strong><br>${r[1]}</div>`).join('')}
    </div>`;
  // Investimentos
  document.getElementById('investimentos').innerHTML = `
    <div class="box"><div class="box-title">💰 Cenários de Investimento</div>
      ${c.investimentos.map(v=>`<div class="inv"><div class="t">${v[0]}</div>${v[1]}</div>`).join('')}
    </div>`;
  // Gráficos
  renderGraficos();
  // Admin
  renderAdmin();
}

function statCard(label,val){
  return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value">${val}</div><div class="stat-change">Dados Meta Ads</div></div>`;
}

/* ============ GRÁFICOS (por empresa) ============ */
function renderGraficos(){
  const c = getCompany();
  document.getElementById('graficos').innerHTML = `
    <div class="charts-grid">
      <div class="chart-container"><div class="chart-title">💰 Gasto por Campanha</div><div class="chart-wrapper"><canvas id="ch_gasto"></canvas></div></div>
      <div class="chart-container"><div class="chart-title">🎯 CPM por Campanha</div><div class="chart-wrapper"><canvas id="ch_cpm"></canvas></div></div>
      <div class="chart-container"><div class="chart-title">🔄 CTR por Campanha</div><div class="chart-wrapper"><canvas id="ch_ctr"></canvas></div></div>
      <div class="chart-container"><div class="chart-title">📊 Impressões vs Cliques</div><div class="chart-wrapper"><canvas id="ch_imp"></canvas></div></div>
    </div>`;
  // destruir charts antigos
  Object.values(charts).forEach(ch=>{try{ch.destroy()}catch(e){}});
  const labels = c.campanhas.map(k=>k.nome);
  const num = s => parseFloat(String(s).replace(/[^\d,.-]/g,'').replace('.','').replace(',','.'))||0;
  const col = c.cor, col2 = shade(c.cor,-40);
  setTimeout(()=>{
    charts.gasto = new Chart(document.getElementById('ch_gasto'),{type:'doughnut',
      data:{labels,datasets:[{data:c.campanhas.map(k=>num(k.gasto)),backgroundColor:[col,col2,'#22c55e','#f59e0b'],borderColor:'#fff',borderWidth:2}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
    charts.cpm = new Chart(document.getElementById('ch_cpm'),{type:'bar',
      data:{labels,datasets:[{label:'CPM (R$)',data:c.campanhas.map(k=>num(k.cpm)),backgroundColor:col}]},
      options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}}}});
    charts.ctr = new Chart(document.getElementById('ch_ctr'),{type:'line',
      data:{labels,datasets:[{label:'CTR (%)',data:c.campanhas.map(k=>num(k.ctr)),borderColor:col,backgroundColor:hex2rgba(col,.15),fill:true,tension:.4,pointRadius:6,pointBackgroundColor:col}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
    charts.imp = new Chart(document.getElementById('ch_imp'),{type:'bar',
      data:{labels,datasets:[
        {label:'Impressões',data:c.campanhas.map(k=>num(k.imp)),backgroundColor:col},
        {label:'Cliques',data:c.campanhas.map(k=>k.cliques),backgroundColor:col2}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
  },60);
}

/* ============ ADMIN — cadastrar nova empresa ============ */
function renderAdmin(){
  document.getElementById('admin').innerHTML = `
    <div class="box" style="border-top-color:#3b82f6">
      <div class="box-title">⚙️ Empresas cadastradas</div>
      <div class="table-container"><table>
        <thead><tr><th>Empresa</th><th>Cidade</th><th>Conta Meta</th><th>Score</th><th></th></tr></thead>
        <tbody>${companies.map(c=>`<tr>
          <td>${c.emoji} <strong>${c.nome}</strong></td><td>${c.cidade}</td><td>${c.contaMeta}</td><td>${c.score}/10</td>
          <td>${companies.length>1?`<button class="logout-btn" onclick="removeCompany('${c.id}')">Remover</button>`:''}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>
    <div class="box" style="border-top-color:#22c55e">
      <div class="box-title">➕ Adicionar nova empresa</div>
      <div class="admin-form">
        <div class="row">
          <div><label>Nome da empresa</label><input id="f_nome" placeholder="Ex: Nova Loja Ltda"></div>
          <div><label>Emoji</label><input id="f_emoji" placeholder="🏪" maxlength="4"></div>
        </div>
        <div class="row">
          <div><label>Cidade/UF</label><input id="f_cidade" placeholder="Cidade/PR"></div>
          <div><label>Cor (hex)</label><input id="f_cor" placeholder="#1565C0" value="#1565C0"></div>
        </div>
        <label>ID da Conta Meta Ads</label><input id="f_conta" placeholder="123456789012345">
        <button onclick="addCompany()">Cadastrar empresa</button>
        <p style="font-size:11px;color:#aaa;margin-top:10px">A empresa entra com estrutura vazia. As campanhas e métricas são preenchidas ao puxar os dados da conta Meta conectada.</p>
      </div>
    </div>`;
}

function addCompany(){
  const nome=val('f_nome'), emoji=val('f_emoji')||'🏪', cidade=val('f_cidade')||'—',
        cor=val('f_cor')||'#1565C0', conta=val('f_conta')||'—';
  if(!nome){ alert('Informe o nome da empresa.'); return; }
  const id = nome.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12)+Date.now().toString().slice(-4);
  companies.push({
    id, nome, emoji, cidade, cor, contaMeta:conta, score:0,
    stats:{gasto:'—',impressoes:'—',cliques:'—',cpl:'—',roas:'—',conversoes:'—'},
    campanhas:[], insights:[['📭 Sem dados ainda','Conecte e puxe os dados da conta Meta desta empresa para popular as métricas.']],
    recomendacoes:[['Puxar dados da conta Meta','Assim que os dados da conta forem importados, as recomendações de IA aparecem aqui.']],
    investimentos:[['Aguardando dados','Os cenários de investimento são gerados após a importação das campanhas.']]
  });
  saveCompanies();
  renderCompanySelect();
  selectCompany(id);
  alert('Empresa "'+nome+'" cadastrada!');
}

function removeCompany(id){
  if(companies.length<=1){ alert('Mantenha ao menos uma empresa.'); return; }
  if(!confirm('Remover esta empresa do dashboard?')) return;
  companies = companies.filter(c=>c.id!==id);
  saveCompanies();
  renderCompanySelect();
  selectCompany(companies[0].id);
}

/* ============ HELPERS ============ */
function val(id){ return document.getElementById(id).value.trim(); }
function switchTab(name,btn){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  btn.classList.add('active');
  if(name==='graficos') renderGraficos();
}
function shade(hex,p){
  const n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+p)),
    g=Math.max(0,Math.min(255,((n>>8)&255)+p)),b=Math.max(0,Math.min(255,(n&255)+p));
  return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0');
}
function hex2rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}

/* ============ AUTO-LOGIN se sessão ativa ============ */
window.addEventListener('load',()=>{
  const s = sessionStorage.getItem('session');
  if(s){ const u=JSON.parse(s); startApp(u); }
  document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
});
</script>
